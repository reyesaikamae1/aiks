<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> kuchuuu phuchuuu🌷</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Decorations -->
    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>

    <div class="butterfly butterfly1">🦋</div>
    <div class="butterfly butterfly2">🦋</div>

    <div class="sparkle sparkle1">✨</div>
    <div class="sparkle sparkle2">✦</div>
    <div class="sparkle sparkle3">✧</div>

    <div class="container">

        <h1>🌸  a flower for u 🌸</h1>

        <p class="subtitle">
            made with love, flowers & a little magic ♡
        </p>


        <!-- BOUQUET -->

        <div class="bouquet">

            <!-- Floating Hearts -->

            <div class="heart heart1">💗</div>
            <div class="heart heart2">💖</div>
            <div class="heart heart3">💗</div>


            <!-- Green Leaves -->

            <div class="leaf leaf1"></div>
            <div class="leaf leaf2"></div>
            <div class="leaf leaf3"></div>
            <div class="leaf leaf4"></div>
            <div class="leaf leaf5"></div>
            <div class="leaf leaf6"></div>


            <!-- LILIES -->

            <div class="flower lily lily1">

                <div class="lily-petal"></div>
                <div class="lily-petal"></div>
                <div class="lily-petal"></div>
                <div class="lily-petal"></div>
                <div class="lily-petal"></div>
                <div class="lily-petal"></div>

                <div class="lily-center"></div>

            </div>


            <div class="flower lily lily2">

                <div class="lily-petal"></div>
                <div class="lily-petal"></div>
                <div class="lily-petal"></div>
                <div class="lily-petal"></div>
                <div class="lily-petal"></div>
                <div class="lily-petal"></div>

                <div class="lily-center"></div>

            </div>


            <!-- TULIP 1 -->

            <div class="tulip tulip1">

                <div class="tulip-petal tulip-pink"></div>
                <div class="tulip-petal tulip-pink"></div>
                <div class="tulip-middle tulip-pink"></div>

                <div class="stem"></div>

            </div>


            <!-- TULIP 2 -->

            <div class="tulip tulip2">

                <div class="tulip-petal tulip-yellow"></div>
                <div class="tulip-petal tulip-yellow"></div>
                <div class="tulip-middle tulip-yellow"></div>

                <div class="stem"></div>

            </div>


            <!-- TULIP 3 -->

            <div class="tulip tulip3">

                <div class="tulip-petal tulip-purple"></div>
                <div class="tulip-petal tulip-purple"></div>
                <div class="tulip-middle tulip-purple"></div>

                <div class="stem"></div>

            </div>


            <!-- TULIP 4 -->

            <div class="tulip tulip4">

                <div class="tulip-petal tulip-blue"></div>
                <div class="tulip-petal tulip-blue"></div>
                <div class="tulip-middle tulip-blue"></div>

                <div class="stem"></div>

            </div>


            <!-- DAISY 1 -->

            <div class="daisy daisy1">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="daisy-center"></div>

            </div>


            <!-- DAISY 2 -->

            <div class="daisy daisy2">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="daisy-center"></div>

            </div>


            <!-- DAISY 3 -->

            <div class="daisy daisy3">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="daisy-center"></div>

            </div>


            <!-- SMALL FLOWERS -->

            <div class="small-flower small1">🌸</div>
            <div class="small-flower small2">🌼</div>
            <div class="small-flower small3">🌸</div>
            <div class="small-flower small4">🌼</div>


            <!-- WRAPPING PAPER -->

            <div class="wrapper">

                <div class="wrapper-pattern"></div>

            </div>


            <!-- BIG COQUETTE BOW -->

            <div class="big-bow">

                <div class="bow-left"></div>

                <div class="bow-right"></div>

                <div class="bow-center">♡</div>

                <div class="ribbon-left"></div>

                <div class="ribbon-right"></div>

            </div>


            <!-- MESSAGE CARD -->

            <div class="message-card" id="message">

                <div class="card-heart">♡</div>

                <p>
                    a little bouquet
                </p>

                <small>
                    just for you 🌷
                </small>

            </div>

        </div>


        <!-- BUTTON -->

        <button onclick="openBouquet()">

            💌 Open Me 💌

        </button>


        <p class="footer">
            flowers make everything better 🌈🌸
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
